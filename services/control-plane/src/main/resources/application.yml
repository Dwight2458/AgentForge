server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: agentforge-control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agentforge}
    username: ${DATABASE_USER:agentforge}
    password: ${DATABASE_PASSWORD:agentforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:agentforge}
  session:
    store-type: redis
    timeout: 12h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

agentforge:
  security:
    dev-auth: ${AGENTFORGE_DEV_AUTH:true}
  runtime:
    base-url: ${AGENT_RUNTIME_URL:http://localhost:8081}
    run-timeout: 60m
    max-repair-rounds: 3
    max-tool-calls: 150
    max-tokens: 200000
    max-parallel-subagents: 3
  messaging:
    outbox-enabled: ${OUTBOX_ENABLED:false}
    outbox-delay: 500ms
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    api-version: ${GITHUB_API_VERSION:2026-03-10}
    app-slug: ${GITHUB_APP_SLUG:}
    app-id: ${GITHUB_APP_ID:0}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}

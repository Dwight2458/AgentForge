name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-console/package-lock.json
      - run: mvn -q test
      - run: uv run --project services/agent-runtime pytest services/agent-runtime/tests -q
      - run: uv run --project services/sandbox-executor pytest services/sandbox-executor/tests -q
      - run: npm ci
        working-directory: apps/web-console
      - run: npm run type-check && npm run test:unit && npm run lint && npm run build-only
        working-directory: apps/web-console

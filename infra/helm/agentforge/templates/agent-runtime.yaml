apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-runtime
  labels:
    app.kubernetes.io/component: agent-runtime
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent-runtime
          image: {{ .Values.images.agentRuntime | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef: { name: {{ include "agentforge.secretName" . }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.agentRuntime | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentforge-agent-runtime
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: agent-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8081
      targetPort: http

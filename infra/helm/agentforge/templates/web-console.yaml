apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-console
  labels:
    app.kubernetes.io/component: web-console
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web-console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web-console
          image: {{ .Values.images.webConsole | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NGINX_RESOLVER
              value: {{ .Values.config.clusterDns | quote }}
            - name: CONTROL_PLANE_HOST
              value: {{ .Values.config.controlPlaneHost | quote }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.webConsole | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentforge-web-console
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: web-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: http
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentforge-web-console
                port:
                  number: {{ .Values.service.webPort }}
{{- end }}

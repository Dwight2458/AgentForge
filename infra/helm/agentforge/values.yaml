imagePullPolicy: IfNotPresent

images:
  controlPlane: agentforge/control-plane:dev
  agentRuntime: agentforge/agent-runtime:dev
  webConsole: agentforge/web-console:dev
  sandboxExecutor: agentforge/sandbox-executor:dev

replicaCount: 1

service:
  webPort: 80

config:
  databaseUrl: jdbc:postgresql://host.docker.internal:5432/agentforge
  databaseUser: agentforge
  kafkaBootstrapServers: host.docker.internal:29093
  outboxEnabled: true
  kafkaConsumerEnabled: true
  runCommandsTopic: agentforge.run.commands.v1
  runEventsTopic: agentforge.run.events.v1
  kafkaConsumerGroup: agentforge-control-plane-v1
  redisHost: host.docker.internal
  redisPort: "6379"
  s3Endpoint: http://host.docker.internal:9000
  runtimeCheckpointDsn: postgresql://agentforge:agentforge@host.docker.internal:5432/agentforge
  clusterDns: 10.43.0.10
  # Nginx's runtime resolver does not apply the pod DNS search suffixes.
  controlPlaneHost: agentforge-control-plane.agentforge.svc.cluster.local:8080
  devAuth: true
  githubAppId: "0"
  githubAppSlug: ""
  githubApiVersion: "2026-03-10"
  modelProvider: fake
  modelBaseUrl: https://api.openai.com/v1
  model: fake-planner-v1
  modelTimeoutSeconds: "60"

secret:
  existingSecret: ""
  databasePassword: agentforge
  redisPassword: agentforge
  executorToken: replace-for-any-shared-environment
  modelApiKey: ""
  githubClientId: ""
  githubClientSecret: ""
  githubPrivateKey: ""

resources:
  controlPlane:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  agentRuntime:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  webConsole:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

ingress:
  enabled: true
  className: traefik
  host: agentforge.localhost
